<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO DE CURRÍCULO</title>
</head>
<body>
    <form action="">
        <label for="nome">Nome: </label>
        <input type="text" id="none" required>

        <p>Qual sua área? <br>
        <!-- não é necessário colocar o input na label se ele estiver dentro dela
         o atributo de name representa o grupo
         o atributo de value precisa ser definido e recebe o valor (é como se fosse o valor digitado em um campo de texto) -->
        <label>
            <input type="checkbox" name="area" id="design" value="design">
            Design
        </label> <br>
        <label>
            <input type="checkbox" name="area" id="prog" value="prog">
            Programação
        </label> <br>
        <label>
            <input type="checkbox" name="area" id="redes" value="redes">
            Redes 
        </label>
        </p>
        <p>
            Qual seu curso: <br>
            <label>
                <input type="radio" name="curso" value="infoweb">
                <!-- assim como no checkbox, o radio também tem que colocar value e name -->
                INFOWEB
            </label> <br>
            <label>
                <input type="radio" name="curso" value="adm">
                ADM
            </label> <br>
            <label>
                <input type="radio" name="curso" value="msi">
                Manutenção e Suporte
            </label> <br>
        </p>
        <fieldset>
            <!-- fieldset é um componente totalmente opcional usado para organizar o formulário visualmente -->
            <legend>MENSAGEM</legend>
            <label for="mensagem">
                Mensagem: <br>
                <textarea name="msn" id="mensagem" cols="30" rows="10"></textarea>
                <!-- essa marcação tem abertura e fechamento porque permite um texto longo com enters
                 cols e rows são permitidos mesmo sendo de formatação
                 difere d =o input do tipo text porque aceita texto longo
                 value é o texto dentro da marcação 
                cols equivale a coluna/ largura
                    rows equivale a /altura -->
            </label>
        </fieldset>

        <label for="idade">
            Idade:
            <input type="number" id="idade" min="1" max="130">
        </label> <br>

        <label for="cidade">
            Cidade:
            <input type="text" id="list-cidade">
        </label>

        <datalist id="cidade">
            <!-- datalist é um componente novo, similar ao combox (select)
             se relaciona com o input com o atributo 'list' 
             permite que o usuário digite e selecione uma opção-->
            <option value="Recife">
            <option value="Natal">
            <option value="João Pessoa">
            <option value="Fortaleza">
        </datalist>

        <input type="hidden" id="id-user" value="5487">

        <input type="submit" value="ENVIAR" disabled>

    </form>
</body>
</html>
